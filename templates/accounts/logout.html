{% extends 'base.html' %}

{% block title %}{{ title }} - Ecommerce Site{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center">Logged Out</h3>
            </div>
            <div class="card-body text-center">
                <p>You have been successfully logged out.</p>
                <div class="mt-3">
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary">Login Again</a>
                    <a href="{% url 'core:home' %}" class="btn btn-secondary">Go Home</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
